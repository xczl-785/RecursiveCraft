plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

evaluationDependsOn(":common")

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    def localJeiApi = file("local-libs/jei-1.21.8-neoforge-api.jar")
    def localJeiRuntime = file("local-libs/jei-1.21.8-neoforge.jar")
    def localModsDir = file("local-mods")

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // pinyin4j依赖
    // 1. 编译时需要 (让代码不爆红)
    implementation 'com.belerweb:pinyin4j:2.5.1'
    // 2. [关键] 开发环境运行时需要 (防止 NoClassDefFoundError)
    runtimeOnly 'com.belerweb:pinyin4j:2.5.1'
    // 3. 打包时需要 (把库塞进 Jar 包里)
    shadowCommon 'com.belerweb:pinyin4j:2.5.1'

    // [新增] JEI NeoForge 依赖
    if (localJeiApi.exists()) {
        compileOnly files(localJeiApi)
    } else {
        compileOnly "mezz.jei:jei-1.21.8-neoforge-api:24.2.0.6"
    }

    if (localJeiRuntime.exists()) {
        // 本地 jar 可规避远端 Maven/TLS 问题，同时保留仓库默认可构建性
        modLocalRuntime files(localJeiRuntime)
    } else {
        modLocalRuntime "mezz.jei:jei-1.21.8-neoforge:24.2.0.6"
    }

    if (localModsDir.exists()) {
        // 外部测试模组通过本地 runtime 依赖接入，让 Loom 在 dev runtime 中先完成 remap
        modLocalRuntime fileTree(dir: localModsDir, include: ["*.jar"])
    }
}

processResources {
    filteringCharset = "UTF-8"

    def replaceProperties = [
            "version": rootProject.mod_version,
            "mod_id": rootProject.mod_id,
            "mod_name": rootProject.mod_name,
            "mod_description": rootProject.mod_description,
            "mod_license": rootProject.mod_license,
            "mod_authors": rootProject.mod_authors,
            "mod_homepage": rootProject.mod_homepage,
            "mod_sources": rootProject.mod_sources
    ]

    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
