plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "recursivecraft-common.mixins.json"
        mixinConfig "recursivecraft.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    def localJeiApi = file("local-libs/jei-1.20.1-forge-api-15.20.0.121.jar")
    def localJeiRuntime = file("local-libs/jei-1.20.1-forge-15.20.0.121.jar")
    def localModsDir = file("local-mods")

    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // pinyin4j依赖
    // 1. 编译时需要 (让代码不爆红)
    implementation 'com.belerweb:pinyin4j:2.5.1'
    // 2. [关键] 开发环境运行时需要 (防止 NoClassDefFoundError)
    forgeRuntimeLibrary 'com.belerweb:pinyin4j:2.5.1'
    // 3. 打包时需要 (把库塞进 Jar 包里)
    shadowCommon 'com.belerweb:pinyin4j:2.5.1'

    // [新增] JEI Forge 依赖
    if (localJeiApi.exists()) {
        modCompileOnly files(localJeiApi)
    } else {
        modCompileOnly "mezz.jei:jei-1.20.1-forge-api:15.2.0.27"
    }

    if (localJeiRuntime.exists()) {
        // 本地 jar 可规避远端 Maven/TLS 问题，同时保留仓库默认可构建性
        modLocalRuntime files(localJeiRuntime)
    } else {
        modLocalRuntime "mezz.jei:jei-1.20.1-forge:15.2.0.27"
    }

    if (localModsDir.exists()) {
        // 外部测试模组通过本地 runtime 依赖接入，让 Loom 在 dev runtime 中先完成 remap
        modLocalRuntime fileTree(dir: localModsDir, include: ["*.jar"])
    }
}

processResources {
    def replaceProperties = [
            "version": rootProject.mod_version,
            "mod_id": rootProject.mod_id,
            "mod_name": rootProject.mod_name,
            "mod_description": rootProject.mod_description,
            "mod_license": rootProject.mod_license,
            "mod_authors": rootProject.mod_authors,
            "mod_homepage": rootProject.mod_homepage,
            "mod_sources": rootProject.mod_sources
    ]

    inputs.properties replaceProperties

    filesMatching("META-INF/mods.toml") {
        expand replaceProperties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
