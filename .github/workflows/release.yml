name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Read versions
        id: versions
        run: |
          echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: release
        run: |
          tag="${GITHUB_REF_NAME}"
          suffix=""
          release_name="RecursiveCraft v${{ steps.versions.outputs.mod_version }}"
          case "$tag" in
            *fix*|*Fix*|*FIX*)
              suffix="-fix"
              release_name="$release_name Fix"
              ;;
          esac

          echo "asset_suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

          awk -v version="${{ steps.versions.outputs.mod_version }}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            {
              echo "## [${{ steps.versions.outputs.mod_version }}]"
              echo
              echo "- Maintenance release for Minecraft ${{ steps.versions.outputs.minecraft_version }}."
            } > release-notes.md
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp fabric/build/libs/recursivecraft-${{ steps.versions.outputs.mod_version }}.jar release-assets/recursivecraft-mc${{ steps.versions.outputs.minecraft_version }}-fabric-v${{ steps.versions.outputs.mod_version }}${{ steps.release.outputs.asset_suffix }}.jar
          cp forge/build/libs/recursivecraft-${{ steps.versions.outputs.mod_version }}.jar release-assets/recursivecraft-mc${{ steps.versions.outputs.minecraft_version }}-forge-v${{ steps.versions.outputs.mod_version }}${{ steps.release.outputs.asset_suffix }}.jar

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ steps.release.outputs.release_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: release-assets/*
