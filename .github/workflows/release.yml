name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Read versions
        id: versions
        run: |
          echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp fabric/build/libs/recursivecraft-${{ steps.versions.outputs.mod_version }}.jar release-assets/recursivecraft-mc${{ steps.versions.outputs.minecraft_version }}-fabric-v${{ steps.versions.outputs.mod_version }}.jar
          cp forge/build/libs/recursivecraft-${{ steps.versions.outputs.mod_version }}.jar release-assets/recursivecraft-mc${{ steps.versions.outputs.minecraft_version }}-forge-v${{ steps.versions.outputs.mod_version }}.jar

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
