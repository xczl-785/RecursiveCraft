name: Build Artifacts

on:
  push:
    branches:
      - 1.20.1
      - 1.21.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.ref_name == '1.20.1' && '17' || '21' }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ github.ref_name }}
          path: fabric/build/libs/*.jar

      - name: Upload Forge artifacts
        if: ${{ hashFiles('forge/build/libs/*.jar') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ github.ref_name }}
          path: forge/build/libs/*.jar

      - name: Upload NeoForge artifacts
        if: ${{ hashFiles('neoforge/build/libs/*.jar') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-${{ github.ref_name }}
          path: neoforge/build/libs/*.jar
